# Codemagic cloud build for Bad Golf (Capacitor iOS).
# Builds the iOS app on a cloud Mac and ships it to TestFlight — no Mac needed.
#
# ONE-TIME setup in the Codemagic web UI (the walkthrough covers this):
#   1. Sign up at codemagic.io with GitHub; give it access to the bad-golf-app repo.
#   2. Team settings -> Integrations -> App Store Connect -> connect your API key.
#      NAME THE INTEGRATION EXACTLY:  BadGolfASC
#      (paste your Issuer ID, Key ID, and upload the AuthKey_XXXX.p8 file).
#   3. Add the app from your repo; Codemagic auto-detects this file.
#   4. Start a build of the "ios-testflight" workflow.
#
# Code signing: the build creates its own distribution certificate + App Store
# provisioning profile via the BadGolfASC API key — no Mac/Keychain needed.

workflows:
  ios-testflight:
    name: Bad Golf iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: BadGolfASC          # must match the integration name in the UI
    environment:
      groups:
        - signing          # holds the secure CERT_KEY variable (set in Codemagic UI)
      vars:
        BUNDLE_ID: "com.simplisticfishing.badgolf"
      node: 20.18.0
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Bundle Supabase locally (offline support)
        script: |
          mkdir -p www/lib
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/lib/supabase.min.js || true
      - name: Add iOS platform if missing
        script: |
          # `cap add ios` runs `pod install` internally, which FAILS at the default
          # iOS 13 because the @capgo SocialLogin pod needs iOS 14. We tolerate that
          # failure here (the Xcode project + Podfile are still generated), then the
          # next step bumps the target and the sync/pod-install steps below succeed.
          if [ ! -d "ios" ]; then npx cap add ios || true; fi
      - name: Bump iOS deployment target to 14 (required by @capgo SocialLogin pod)
        script: |
          # The Google sign-in pod needs iOS 14+. Raise both the Podfile platform
          # and the Xcode project deployment target before pods are installed
          # (cap sync below runs pod install).
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '14.0'/" ios/App/Podfile || true
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g" ios/App/App.xcodeproj/project.pbxproj || true
          echo "Podfile platform line:"; grep "platform :ios" ios/App/Podfile || true
      - name: Generate Bad Golf app icon & splash (from assets/)
        script: |
          npx --yes @capacitor/assets generate --ios
      - name: Capacitor sync (copies web app + plugins into the native project)
        script: npx cap sync ios
      - name: Add privacy + export-compliance keys to Info.plist
        script: |
          PLIST="ios/App/App/Info.plist"
          LOC="Bad Golf uses your location to show GPS distances to the green and track your shots during a round."
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription $LOC" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string $LOC" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          # --- Google sign-in (@capgo SocialLogin) ---
          GID="56040088868-larmg07pd7d9ue6crq69ka7e9pto6m4j.apps.googleusercontent.com"
          /usr/libexec/PlistBuddy -c "Set :GIDClientID $GID" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :GIDClientID string $GID" "$PLIST"
          # --- URL schemes: reversed Google id (OAuth) + bundle id (Supabase redirect) ---
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.googleusercontent.apps.56040088868-larmg07pd7d9ue6crq69ka7e9pto6m4j" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:1 string com.simplisticfishing.badgolf" "$PLIST" 2>/dev/null || true
          echo "Info.plist now has:"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :GIDClientID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"
      - name: Enable Apple entitlements (Sign in with Apple + Associated Domains)
        script: |
          # Codemagic regenerates the iOS project every build via `cap add ios`,
          # which has NO entitlements file — so native Sign in with Apple fails at
          # runtime with AuthorizationError 1000, and Universal Links won't work.
          # Recreate the entitlements here and point the App target at the file
          # (both Debug & Release). The App ID must have BOTH capabilities enabled
          # (Sign in with Apple + Associated Domains) so the fetched profile carries
          # them — otherwise signing fails with a "doesn't include … entitlement".
          ENT="ios/App/App/App.entitlements"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '	<key>com.apple.developer.applesignin</key>' \
            '	<array>' \
            '		<string>Default</string>' \
            '	</array>' \
            '	<key>com.apple.developer.associated-domains</key>' \
            '	<array>' \
            '		<string>applinks:thundertonka2-tech.github.io</string>' \
            '	</array>' \
            '</dict>' \
            '</plist>' > "$ENT"
          echo "Wrote $ENT:"; cat "$ENT"
          # Wire CODE_SIGN_ENTITLEMENTS into the App target via the xcodeproj gem
          # (ships with CocoaPods, already installed on the runner).
          gem install xcodeproj --no-document 2>/dev/null || true
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = proj.targets.find { |t| t.name == "App" }
            abort("App target not found") unless target
            target.build_configurations.each do |c|
              c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements"
            end
            proj.save
            puts "CODE_SIGN_ENTITLEMENTS set on App target (Debug + Release)"
          '
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up code signing (reuse the stored key -> one cert, forever)
        script: |
          keychain initialize
          echo "===== Create/reuse distribution cert + App Store profile (stored CERT_KEY) ====="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERT_KEY \
            --create
          echo "===== Add certificate to keychain ====="
          keychain add-certificates
          echo "===== Apply profiles to the Xcode project ====="
          xcode-project use-profiles
          echo "===== Provisioning profiles on disk ====="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "NO PROFILES DIR"
          echo "===== Signing identities in keychain ====="
          security find-identity -v -p codesigning 2>/dev/null || true
      - name: Set the build number (always higher than anything already on App Store Connect)
        script: |
          # App Store Connect REJECTS any upload whose build number isn't strictly
          # higher than the latest build already there — and the publish step then
          # fails with only a generic "Failed to publish App.ipa to App Store Connect"
          # message (no real error). Earlier manual Xcode/Transporter uploads pushed
          # that number up (this started failing around build 60), so Codemagic's own
          # $BUILD_NUMBER counter is at/below it and every publish silently fails.
          #
          # Use a date+time build number (YEAR.MMDD.HHMM) so it stays readable like
          # the app version — e.g. 2026.0615.1615 — AND always increases: the date
          # moves it forward day to day, and the time moves it forward for multiple
          # builds in the same day. So every upload is higher than the last and App
          # Store Connect accepts it (no more redundant-binary rejection).
          NEXT="$(date +%Y.%m%d.%H%M)"
          echo "Setting CFBundleVersion to $NEXT"
          cd ios/App
          agvtool new-version -all "$NEXT"
      - name: Build the iOS app (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # (Add your testers in App Store Connect -> TestFlight after the first upload.)
