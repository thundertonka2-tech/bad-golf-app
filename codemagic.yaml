# Codemagic cloud build for Bad Golf (Capacitor iOS).
# Builds the iOS app on a cloud Mac and ships it to TestFlight — no Mac needed.
#
# ONE-TIME setup in the Codemagic web UI (the walkthrough covers this):
#   1. Sign up at codemagic.io with GitHub; give it access to the bad-golf-app repo.
#   2. Team settings -> Integrations -> App Store Connect -> connect your API key.
#      NAME THE INTEGRATION EXACTLY:  BadGolfASC
#      (paste your Issuer ID, Key ID, and upload the AuthKey_XXXX.p8 file).
#   3. Add the app from your repo; Codemagic auto-detects this file.
#   4. Start a build of the "ios-testflight" workflow.
#
# Code signing: the build creates its own distribution certificate + App Store
# provisioning profile via the BadGolfASC API key — no Mac/Keychain needed.

workflows:
  ios-testflight:
    name: Bad Golf iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: BadGolfASC          # must match the integration name in the UI
    environment:
      groups:
        - signing          # holds the secure CERT_KEY variable (set in Codemagic UI)
      vars:
        BUNDLE_ID: "com.simplisticfishing.badgolf"
      node: 20.18.0
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Bundle Supabase locally (offline support)
        script: |
          mkdir -p www/lib
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/lib/supabase.min.js || true
      - name: Add iOS platform if missing
        script: |
          # `cap add ios` runs `pod install` internally, which FAILS at the default
          # iOS 13 because the @capgo SocialLogin pod needs iOS 14. We tolerate that
          # failure here (the Xcode project + Podfile are still generated), then the
          # next step bumps the target and the sync/pod-install steps below succeed.
          if [ ! -d "ios" ]; then npx cap add ios || true; fi
      - name: Bump iOS deployment target to 15 (Apple ITMS-90068 + @capgo SocialLogin pod)
        script: |
          # The Google sign-in pod needs iOS 14+, so this step originally set 14.0.
          # v941 (Tyler, Aug 2026): Apple now warns on every upload —
          #   "ITMS-90068: MinimumOSVersion too low - This app has a MinimumOSVersion of
          #    14.0. Starting in Spring 2027, all iOS apps must have a MinimumOSVersion of
          #    15.0 or later in order to be uploaded to App Store Connect."
          # MinimumOSVersion in the built Info.plist comes straight from
          # IPHONEOS_DEPLOYMENT_TARGET, so raising it here clears the warning at the source.
          # Dropping iOS 14 costs essentially nothing (iOS 15 shipped in 2021) and the
          # /g flag applies it to every iOS target, including the widget extension.
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile || true
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj || true
          echo "Podfile platform:"; grep "platform :ios" ios/App/Podfile || true
          echo "Deployment targets:"; grep -c "IPHONEOS_DEPLOYMENT_TARGET = 15.0;" ios/App/App.xcodeproj/project.pbxproj || true
          # Xcode 26 saves the project at objectVersion 70, which the build machine's
          # CocoaPods/Xcodeproj gem can't read ("Unable to find compatibility version
          # string for object version 70"). Lower it so `pod install` can parse it.
          sed -i '' "s/objectVersion = 70;/objectVersion = 60;/" ios/App/App.xcodeproj/project.pbxproj || true
          echo "objectVersion now:"; grep "objectVersion" ios/App/App.xcodeproj/project.pbxproj || true
          echo "Podfile platform line:"; grep "platform :ios" ios/App/Podfile || true
      - name: Generate Bad Golf app icon & splash (from assets/)
        script: |
          npx --yes @capacitor/assets generate --ios
      - name: Capacitor sync (copies web app + plugins into the native project)
        script: npx cap sync ios
      - name: Add privacy + export-compliance keys to Info.plist
        script: |
          PLIST="ios/App/App/Info.plist"
          LOC="Bad Golf uses your location to show GPS distances to the green and track your shots during a round."
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription $LOC" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string $LOC" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          # --- Google sign-in (@capgo SocialLogin) ---
          GID="56040088868-larmg07pd7d9ue6crq69ka7e9pto6m4j.apps.googleusercontent.com"
          /usr/libexec/PlistBuddy -c "Set :GIDClientID $GID" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :GIDClientID string $GID" "$PLIST"
          # --- URL schemes: reversed Google id (OAuth) + bundle id (Supabase redirect) ---
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.googleusercontent.apps.56040088868-larmg07pd7d9ue6crq69ka7e9pto6m4j" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:1 string com.simplisticfishing.badgolf" "$PLIST" 2>/dev/null || true
          # --- Live Activity (Lock Screen / Dynamic Island round card) ---
          # NSSupportsLiveActivities lets the app request ActivityKit activities;
          # the badgolf:// scheme is what tapping the card deep-links back through.
          /usr/libexec/PlistBuddy -c "Set :NSSupportsLiveActivities true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSSupportsLiveActivities bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:2 string badgolf" "$PLIST" 2>/dev/null || true
          echo "Info.plist now has:"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :GIDClientID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"
      - name: Enable Apple entitlements (Sign in with Apple + Associated Domains)
        script: |
          # Codemagic regenerates the iOS project every build via `cap add ios`,
          # which has NO entitlements file — so native Sign in with Apple fails at
          # runtime with AuthorizationError 1000, and Universal Links won't work.
          # Recreate the entitlements here and point the App target at the file
          # (both Debug & Release). The App ID must have BOTH capabilities enabled
          # (Sign in with Apple + Associated Domains) so the fetched profile carries
          # them — otherwise signing fails with a "doesn't include … entitlement".
          ENT="ios/App/App/App.entitlements"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '	<key>aps-environment</key>' \
            '	<string>production</string>' \
            '	<key>com.apple.developer.applesignin</key>' \
            '	<array>' \
            '		<string>Default</string>' \
            '	</array>' \
            '	<key>com.apple.developer.associated-domains</key>' \
            '	<array>' \
            '		<string>applinks:thundertonka2-tech.github.io</string>' \
            '	</array>' \
            '	<key>keychain-access-groups</key>' \
            '	<array>' \
            '		<string>$(AppIdentifierPrefix)com.simplisticfishing.badgolf</string>' \
            '		<string>$(AppIdentifierPrefix)com.simplisticfishing.badgolf.shared</string>' \
            '	</array>' \
            '</dict>' \
            '</plist>' > "$ENT"
          echo "Wrote $ENT:"; cat "$ENT"
          # Wire CODE_SIGN_ENTITLEMENTS into the App target via the xcodeproj gem
          # (ships with CocoaPods, already installed on the runner).
          gem install xcodeproj --no-document 2>/dev/null || true
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = proj.targets.find { |t| t.name == "App" }
            abort("App target not found") unless target
            target.build_configurations.each do |c|
              c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements"
            end
            proj.save
            puts "CODE_SIGN_ENTITLEMENTS set on App target (Debug + Release)"
          '
      - name: Add the Live Activity widget extension target (BadGolfWidgets)
        script: |
          # The Lock Screen / Dynamic Island round card. The Swift sources live in
          # ios/App/BadGolfWidgets/ (committed); this script wires them into the
          # Xcode project as an extension target + adds LiveActivityPlugin to the
          # App target. Idempotent. Uses the xcodeproj gem (installed above).
          gem install xcodeproj --no-document 2>/dev/null || true
          ruby ios-config/add_widget_target.rb
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up code signing (reuse the stored key -> one cert, forever)
        script: |
          keychain initialize
          echo "===== Create/reuse distribution cert + App Store profile (stored CERT_KEY) ====="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERT_KEY \
            --create
          # The Apple Watch app ships INSIDE the iOS app but is its own bundle id,
          # so it needs its OWN App Store profile or the build fails with
          # "no profile for ...watchkitapp". Fetch/create it too.
          echo "===== Create/reuse App Store profile for the WATCH app ====="
          app-store-connect fetch-signing-files "${BUNDLE_ID}.watchkitapp" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERT_KEY \
            --create || echo "WARN: watch profile fetch failed (check App Group/Keychain caps on the watch App ID)"
          # The Live Activity widget extension is ALSO its own bundle id and needs
          # its own App Store profile (no special capabilities required).
          echo "===== Create/reuse App Store profile for the WIDGET extension ====="
          app-store-connect fetch-signing-files "${BUNDLE_ID}.widgets" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERT_KEY \
            --create
          echo "===== Add certificate to keychain ====="
          keychain add-certificates
          echo "===== Apply profiles to the Xcode project ====="
          xcode-project use-profiles
          echo "===== Provisioning profiles on disk ====="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "NO PROFILES DIR"
          echo "===== Signing identities in keychain ====="
          security find-identity -v -p codesigning 2>/dev/null || true
      - name: Set the build number (always higher than anything already on App Store Connect)
        script: |
          # App Store Connect REJECTS any upload whose build number isn't strictly
          # higher than the latest build already there — and the publish step then
          # fails with only a generic "Failed to publish App.ipa to App Store Connect"
          # message (no real error). Earlier manual Xcode/Transporter uploads pushed
          # that number up (this started failing around build 60), so Codemagic's own
          # $BUILD_NUMBER counter is at/below it and every publish silently fails.
          #
          # Build number = a Unix timestamp (seconds). This is the ONLY format that
          # reliably keeps working here: a previous successful upload set the build
          # number to a timestamp (~1.78 billion), and App Store Connect requires the
          # next build to be a strictly HIGHER number. A readable "2026.MM.DD" style
          # number starts with 2026, which ASC reads as far LOWER than 1.78 billion,
          # so it gets rejected as a redundant/lower binary. A fresh timestamp is
          # always larger than the last one and stays under the 2^31 limit until 2038,
          # so every upload is accepted. (To switch back to readable numbers you'd
          # bump the app's marketing version, CFBundleShortVersionString, which resets
          # the build-number train — ask and I'll wire that in.)
          # Keep the VISIBLE version in sync with the app everywhere: read BG_BUILD
          # (the footer version, e.g. v2026.11.19) from the synced web app and set it
          # as the marketing version (CFBundleShortVersionString). That's the number
          # App Store Connect / TestFlight shows next to the build, so the app footer,
          # ASC, and TestFlight all read the same. The build number (CFBundleVersion,
          # the bit in parentheses) stays a timestamp — it MUST keep climbing past the
          # ~1.78B already on ASC, so it can't be a 2026.x.x value.
          VER=$(grep -oE "BG_BUILD *= *'[^']+'" www/index.html | head -1 | sed -E "s/.*'v?([0-9.]+)'.*/\1/")
          NEXT="$(date +%s)"
          cd ios/App
          if [ -n "$VER" ]; then echo "Marketing version -> $VER"; agvtool new-marketing-version "$VER" || true; fi
          echo "Build number (CFBundleVersion) -> $NEXT"
          agvtool new-version -all "$NEXT"
      - name: Build the iOS app (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # (Add your testers in App Store Connect -> TestFlight after the first upload.)

  # =========================================================================
  # ANDROID — builds the Play Store bundle (.aab) on a cloud Linux machine and
  # uploads it to Google Play (internal testing track first).
  #
  # ONE-TIME setup in the Codemagic web UI (see Bad_Golf_Android_Setup_Guide):
  #   1. Teams -> code signing identities -> Android keystores -> "Generate new"
  #      NAME IT EXACTLY:  badgolf_upload   (Codemagic makes + stores the keystore)
  #   2. Team settings -> Integrations: none needed — Play publishing uses a
  #      service-account JSON stored as a SECURE group variable instead:
  #      Add environment group "google_play" with variable
  #      GCLOUD_SERVICE_ACCOUNT_CREDENTIALS = (paste the service-account .json)
  #   3. (Later, for Android push) add variable GOOGLE_SERVICES_JSON to the SAME
  #      "google_play" group = (paste the google-services.json contents).
  #      Until it exists the app still BUILDS — push notifications just stay
  #      off on Android (the gradle google-services plugin only applies when the
  #      file is present; Capacitor's template guards it).
  # =========================================================================
  android-play:
    name: Bad Golf Android -> Google Play
    instance_type: linux_x2
    max_build_duration: 60
    # v927+: AUTO-TRIGGER — every push to main builds Android automatically,
    # matching the iOS TestFlight flow. Tyler's release process is now just
    # "push": web deploys, iOS builds, Android builds + rolls out to internal.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      android_signing:
        - badgolf_upload            # must match the keystore name in the UI
      groups:
        - google_play               # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (+ GOOGLE_SERVICES_JSON once Firebase is set up)
        # NOTE: referencing a group that doesn't exist FAILS the build in Codemagic.
        # So the optional Firebase variable lives in the google_play group too —
        # when you do the Firebase step, add GOOGLE_SERVICES_JSON to google_play.
      vars:
        PACKAGE_NAME: "com.simplisticfishing.badgolf"
      node: 20.18.0
      java: 17
    cache:
      cache_paths:
        # node_modules is deliberately NOT cached (it was, and the cache went
        # corrupt: the `cap` bin shim survived while @capacitor/cli's package
        # vanished → "Cannot find module '../package.json'". A build that gets
        # cancelled mid-install, or the crash-guard's `npm remove`, can poison
        # a node_modules cache. Fresh install costs ~40s and can't rot.)
        - $HOME/.gradle/caches
    scripts:
      - name: Install npm dependencies (always fresh — see cache note above)
        script: |
          rm -rf node_modules
          npm install
      - name: Bundle Supabase locally (offline support)
        script: |
          mkdir -p www/lib
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/lib/supabase.min.js || true
      - name: Add Android platform if missing
        script: |
          if [ ! -d "android" ]; then npx cap add android; fi
      - name: Drop in google-services.json (Android push) when configured
        script: |
          # SANITY CHECK (learned on build 3): a real google-services.json contains a
          # "project_info" object. The OTHER Firebase download (the service-account
          # private key, which belongs in SUPABASE) contains "service_account" instead —
          # pasting that one here made gradle fail with "Missing project_info object".
          # Wrong/garbled content now falls back to a no-push build instead of failing.
          if [ -n "$GOOGLE_SERVICES_JSON" ] && ! echo "$GOOGLE_SERVICES_JSON" | grep -q "project_info"; then
            echo "WARNING: GOOGLE_SERVICES_JSON does not look like google-services.json (no project_info)."
            echo "         It may be the SERVICE-ACCOUNT key (that one goes in Supabase, not here)."
            echo "         Building WITHOUT push so the build succeeds — fix the variable to enable push."
            GOOGLE_SERVICES_JSON=""
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written — FCM push enabled."
          else
            echo "GOOGLE_SERVICES_JSON not set — building WITHOUT Android push (fine for first builds)."
            # CRASH GUARD (learned the hard way on build 1): the push plugin's
            # register() call at app launch throws a NATIVE Firebase exception on
            # Android when no google-services.json is baked in — instant crash on
            # open, uncatchable from JS. So when Firebase isn't configured, strip
            # the push plugin from THIS build entirely; push-bridge.js already
            # no-ops quietly when the plugin is absent. iOS builds are unaffected.
            npm remove @capacitor/push-notifications || true
          fi
      - name: Generate Bad Golf app icon & splash (from assets/)
        script: |
          npx --yes @capacitor/assets generate --android
      - name: Capacitor sync (copies web app + plugins into the native project)
        script: npx cap sync android
      - name: Add location permissions to the Android manifest (GPS)
        script: |
          # Capacitor's Geolocation plugin deliberately does NOT declare location
          # permissions — the app must. Without these the permission request is
          # denied instantly (no prompt) and the app reads it as "GPS is off"
          # (exact bug testers hit on the first public builds: "turn on GPS
          # services" with location already on, web fine, every phone).
          # The android/ project is regenerated each build, so inject every time.
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "ACCESS_FINE_LOCATION" "$M"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' "$M"
          fi
          grep -E "LOCATION|location.gps" "$M" && echo "Location permissions present."
      - name: Target the Android API level Google Play requires
        script: |
          # Play requires apps to target within 1 year of the latest Android release.
          # Aug 2026 requirement: API 36 (Android 16) — deadline Aug 30, 2026 (the
          # Play Console flagged our API-35 bundles). Bump BOTH compile + target.
          sed -i "s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/" android/variables.gradle || true
          sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/" android/variables.gradle || true
          # The Capacitor template's Android Gradle Plugin predates SDK 36 — it
          # builds fine but hard-warns; this property acknowledges the mismatch.
          grep -q "suppressUnsupportedCompileSdk" android/gradle.properties 2>/dev/null || \
            echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          grep -E "compileSdkVersion|targetSdkVersion" android/variables.gradle
      - name: Set version name (BG_BUILD) + version code (timestamp)
        script: |
          # versionName = the app's own BG_BUILD footer version, so Play Console,
          # the app footer and TestFlight all read the same number.
          # versionCode = Unix timestamp (must always climb; fits Play's int cap).
          VER=$(grep -oE "BG_BUILD *= *'[^']+'" www/index.html | head -1 | sed -E "s/.*'v?([0-9.]+)'.*/\1/")
          CODE="$(date +%s)"
          GRADLE="android/app/build.gradle"
          [ -n "$VER" ] && sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/" "$GRADLE"
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" "$GRADLE"
          grep -E "versionName|versionCode" "$GRADLE"
      - name: Enable R8 (code shrinking + obfuscation) with safe keep rules
        script: |
          # v941 (Tyler, Aug 2026): Play flagged two related advisories on every upload —
          # "Improve your app's memory and performance with R8 optimization" and
          # "There is no deobfuscation file associated with this App Bundle".
          # Both are answered by turning R8 on for the release build. Building the
          # bundle with minification ALSO embeds the obfuscation mapping into the .aab
          # (BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map), so Play
          # picks the deobfuscation file up automatically — no extra upload step.
          #
          # android/ is regenerated by `cap add android` on every build, so this is applied
          # here rather than committed.
          #
          # DELIBERATELY NOT enabling `shrinkResources` this round: it's a separate
          # optimization that can silently strip a drawable (e.g. the splash), and we're
          # changing one variable at a time on a build that has to be trusted. Add it in a
          # later build once R8 is proven on a device.
          GRADLE="android/app/build.gradle"
          sed -i "s/minifyEnabled false/minifyEnabled true/" "$GRADLE"
          # proguard-android-optimize.txt is the same defaults plus the optimization passes.
          sed -i "s/proguard-android.txt/proguard-android-optimize.txt/" "$GRADLE"

          # v1015 (Tyler, Aug 2026): Play STILL listed "Improve your app's memory and
          # performance with R8 optimization" against release 2026.11.1011, months after
          # this step was added. The sed above is a silent no-op if the Capacitor template
          # ever stops shipping the literal `minifyEnabled false` line — and a no-op here
          # looks exactly like success. So: if the release block does not have minifyEnabled
          # after the edit, INSERT it; then assert, and fail the build if it still is not on.
          if ! awk '/release *\{/,/^        \}/' "$GRADLE" | grep -q "minifyEnabled"; then
            echo "NOTE: template had no minifyEnabled line — inserting one."
            perl -0pi -e 's/(release\s*\{)/$1\n            minifyEnabled true/' "$GRADLE"
          fi
          echo "--- release buildType now:"; sed -n '/buildTypes/,/^    }/p' "$GRADLE"
          if awk '/release *\{/,/^        \}/' "$GRADLE" | grep -q "minifyEnabled true"; then
            echo "R8: ENABLED for the release build."
          else
            echo "R8: NOT enabled — refusing to ship a build that silently skips minification."
            exit 1
          fi

          # Keep rules. Capacitor's own library already ships consumerProguardFiles that keep
          # @CapacitorPlugin classes and anything extending com.getcapacitor.Plugin, but the
          # third-party plugins pulled in by @capgo/capacitor-social-login (Google identity,
          # Credential Manager, Auth0's Gson-based JWT decoder, Facebook login) are the parts
          # most likely to break under reflection. These rules are deliberately broad —
          # correctness first; we can tighten them later if size matters more.
          cat >> android/app/proguard-rules.pro <<'PROGUARD'

          # ===================== Bad Golf v941 R8 keep rules =====================
          # Keep crash reports readable: line numbers survive, and Play's mapping file
          # (auto-embedded in the .aab) turns the obfuscated names back into real ones.
          -keepattributes SourceFile,LineNumberTable
          -renamesourcefileattribute SourceFile
          # Reflection / JSON binding needs these preserved.
          -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,Exceptions

          # --- Capacitor bridge + every plugin (belt-and-braces) ---
          -keep public class * extends com.getcapacitor.Plugin { *; }
          -keep @com.getcapacitor.annotation.CapacitorPlugin public class * { *; }
          -keep class com.getcapacitor.** { *; }
          -keep class com.capacitorjs.** { *; }
          -keepclassmembers class * { @com.getcapacitor.PluginMethod public *; }

          # --- Anything the WebView calls into from JavaScript ---
          -keepclassmembers class * { @android.webkit.JavascriptInterface <methods>; }

          # --- Google sign-in path (@capgo/capacitor-social-login) ---
          -keep class ee.forgr.capacitor.social.login.** { *; }
          -keep class com.google.android.libraries.identity.googleid.** { *; }
          -keep class com.google.android.gms.auth.** { *; }
          -keep class androidx.credentials.** { *; }

          # --- Auth0 jwtdecode parses JWT claims with Gson reflection ---
          -keep class com.auth0.android.jwt.** { *; }
          -keepclassmembers class * { @com.google.gson.annotations.SerializedName <fields>; }

          # --- Facebook login (transitive dep of the social-login plugin) ---
          -keep class com.facebook.** { *; }
          -dontwarn com.facebook.**

          # --- Firebase / FCM push ---
          -keep class com.google.firebase.** { *; }
          -dontwarn com.google.firebase.**

          # --- Optional runtime deps R8 warns about but that are never loaded ---
          -dontwarn okhttp3.**
          -dontwarn okio.**
          -dontwarn org.conscrypt.**
          -dontwarn org.bouncycastle.**
          -dontwarn org.openjsse.**
          # =======================================================================
          PROGUARD
          echo "--- proguard-rules.pro tail:"; tail -20 android/app/proguard-rules.pro
      - name: Build the release bundle (.aab)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Sign the bundle with the upload keystore
        script: |
          AAB=$(find android/app/build/outputs -name "*.aab" | head -1)
          echo "Signing $AAB"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" \
            -keypass "$CM_KEY_PASSWORD" "$AAB" "$CM_KEY_ALIAS"
          jarsigner -verify "$AAB" && echo "Signature OK"
      - name: Publish to Google Play (internal) — non-fatal while permissions settle
        script: |
          # Moved out of the `publishing:` section on purpose: Google kept answering
          # "The caller does not have permission" while the service-account grant
          # propagates (can take up to 24-48h), and the built-in publisher FAILS the
          # whole build over it. Here a refused upload just prints a warning — the
          # signed AAB is still attached as an artifact for a manual Play upload —
          # and the day Google says yes, this same step publishes automatically.
          AAB=$(find android/app/build/outputs -name "*.aab" | head -1)
          # v927+: --draft removed — the release ROLLS OUT to internal testing
          # automatically (testers only; production stays a manual decision).
          if google-play bundles publish \
               --credentials @env:GCLOUD_SERVICE_ACCOUNT_CREDENTIALS \
               --bundle "$AAB" --track internal; then
            echo "✅ Published + rolled out to Google Play internal testing."
          else
            echo "⚠️  Google Play refused the upload (likely the service-account permission"
            echo "    still propagating). BUILD CONTINUES — download the signed .aab from"
            echo "    this build's Artifacts and upload it manually in Play Console →"
            echo "    Internal testing → Create new release → Add from library/upload."
          fi
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
