# Codemagic cloud build for Bad Golf (Capacitor iOS).
# This lets you build & ship the iOS app to TestFlight WITHOUT owning a Mac.
# Codemagic runs the build on their Mac in the cloud.
#
# Before this runs, you set up (one time, in the Codemagic web UI):
#   1. Connect this GitHub repo to Codemagic.
#   2. Add an "App Store Connect API key" integration (Codemagic > Teams > Integrations).
#      Apple gives you this key in App Store Connect > Users and Access > Integrations.
#   3. Create an environment variable group called "appstore_credentials" and set
#      APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY,
#      and BUNDLE_ID = com.simplisticfishing.badgolf  (mark the private key "Secure").
#   4. Register the bundle id com.simplisticfishing.badgolf in your Apple Developer account
#      (Codemagic can also auto-create it during signing).
#
# The full beginner walkthrough is in README_START_HERE.md.

workflows:
  ios-testflight:
    name: Bad Golf iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.simplisticfishing.badgolf"
      node: 20.x
      xcode: latest
      cocoapods: default
    cache:
      # Cache dependencies so each rebuild is much faster (skips re-downloading).
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/ios/App/Pods
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Bundle Supabase locally (offline support)
        script: |
          mkdir -p www/lib
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/lib/supabase.min.js
      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi
      - name: Capacitor sync (copies web app + plugins into the native project)
        script: |
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up code signing (automatic, via App Store Connect API key)
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build the iOS app (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testers (you, Kevin, Michael) get the build automatically.
        beta_groups:
          - "Internal Testers"
