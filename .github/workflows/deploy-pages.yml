# Auto-publish officialbadgolf.com from the repo on every push to main.
#
# Layout of the published site (v1686, 2026-09-12):
#   /            marketing site, generated from site/ (home, features, download,
#                games/, leagues/, courses/<state>/<course>/ ... sitemap, robots)
#   /app/        THE WEB APP — a copy of golf-app.html plus the images/folders the
#                app references relatively (avatars/, lib/, BadGolfIcon.jpg ...)
#   /golf-app.html  still published at the root for old bookmarks/links
# golf-app.html stays the single source of truth for the web app; edit it (and
# www/index.html) exactly as before. The marketing pages are edited in site/.
# The www/ folder is the NATIVE app build (Codemagic only) and is not published.
#
# One-time setup: GitHub repo -> Settings -> Pages -> "Build and deployment" ->
# Source = "GitHub Actions". That's it.
#
# WHY TWO JOBS (build + deploy): a single-job workflow re-uploaded the
# "github-pages" artifact every time you clicked "Re-run failed jobs", leaving
# the run with TWO artifacts of the same name -> deploy-pages died with
# "Multiple artifacts named github-pages were unexpectedly found. Artifact
# count is 2." Splitting the upload (build) from the publish (deploy) means a
# "Re-run failed jobs" only re-runs DEPLOY — the already-green build job is
# skipped, so no second artifact is ever created. The collision can't happen.

name: Deploy website (root)

on:
  push:
    branches: [main]
    # The website artifact is WEB-only (the build job strips data/, www/, ios/,
    # screenshots). So a push that ONLY touches those can't change the published
    # site — don't trigger a Pages deploy for it. This stops the frequent
    # course-data (data/**) pushes from firing a deploy that then hits GitHub
    # Pages' transient "Deployment failed, try again later" and shows a red X.
    # Course data is served from raw.githubusercontent (not Pages), so it's live
    # the moment you push regardless. A push touching golf-app.html/index.html or
    # the workflow still deploys normally.
    paths-ignore:
      - 'data/**'
      - 'www/**'
      - 'ios/**'
      - '**/*.png'
      - '**/*.PNG'
      - '**/*.zip'
      - '**/*.mov'
      - '**/*.MOV'
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build the web-only artifact once.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v1686: the app lives at /app/. golf-app.html is copied to app/index.html so
      # officialbadgolf.com/app/ serves the current build (BG_PUBLIC_URL and every
      # invite link point there). The app references a handful of files relatively
      # (BadGolfIcon.jpg, avatars/, lib/, terms.html ...) so those are copied beside it.
      - name: Publish the web app at /app/
        run: |
          mkdir -p app
          cp golf-app.html app/index.html
          cp -r avatars lib assets merch app/
          for f in BadGolfIcon.jpg roland-birdie.jpg bigshooter.JPG sips_popup.JPG stroke_popup.JPG chicken_dance.mp4 chicken_dance.webm splash1.jpg \
                   terms.html privacy.html support.html delete-account.html Bad_Golf_Player_Guide.pdf Bad_Golf_Admin_Guide.pdf Bad_Golf_Privacy_Policy.pdf Bad_Golf_Terms_of_Service.pdf; do
            [ -f "$f" ] && cp "$f" app/ || true
          done
          test -s app/index.html
      # v1686: the marketing site. site/fetch-courses.mjs pulls the live course library
      # from Supabase (anon key, read-only); site/build-site.mjs renders every page into
      # the repo root of this runner checkout (index.html, games/, courses/, sitemap.xml,
      # robots.txt, 404.html, site.css, img/). The repo's own stale root index.html is
      # overwritten here and never published. If the fetch fails the job fails, so the
      # previous deploy stays live instead of publishing a site with no course pages.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the marketing site (root)
        run: |
          node site/fetch-courses.mjs site-data/courses.json
          node site/build-site.mjs --out . --courses site-data/courses.json
          test -s index.html && test -s courses/index.html && test -s sitemap.xml
      # Trim the artifact to WEB-only. The native app build (www/, ios/), the
      # course-import CSVs (data/), the site generator source (site/, site-data/) and
      # big marketing screenshots are NOT served by the website — shipping the full
      # repo made deploy-pages slow/unreliable (stuck publishes, cancel pile-ups).
      # Removals hit only this ephemeral runner checkout, never the repo. Keeps
      # golf-app.html, app/, the generated site, the PDFs, privacy/terms html, and the
      # images the app actually loads.
      - name: Trim non-web files from the Pages artifact
        run: |
          rm -rf ios www data node_modules .git site site-data
          rm -f "Screenshot "*.png "Screenshot "*.PNG BadGolf_iPad_*.png || true
          # v1465: STALE APP COPIES MUST NOT BE PUBLISHED. Every one of these is an
          # old build still carrying the wagering UI the app no longer has, and
          # _worktree_backup_pre547/ additionally carries the pre-filled Venmo /
          # Cash App / PayPal payment deep links that Apple rejected the app over
          # (removed from the live code in v1449). They were all reachable on
          # officialbadgolf.com - the domain the App Store listing points at.
          # Removals hit only this ephemeral runner checkout, never the repo.
          rm -rf _worktree_backup_pre547
          rm -f Index50.html IndexOld.html index45.html index55.html indexOLD2.html indexoldfd2.html || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .          # publish the repo ROOT (marketing site + app/ + golf-app.html)

  # Publish the artifact the build job produced. Re-running THIS job alone
  # (the default "Re-run failed jobs") never re-uploads, so it can't duplicate.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
