# Auto-publish the Bad Golf website from the SAME master the app uses (www/).
# Every time you push to GitHub, this puts the contents of www/ live on
# GitHub Pages. One push updates both your website and (via Codemagic) your app.
#
# One-time setup: GitHub repo -> Settings -> Pages -> "Build and deployment" ->
# Source = "GitHub Actions". That's it.

name: Deploy website (www)

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www        # publish the www/ master folder
      - id: deployment
        uses: actions/deploy-pages@v4
