# Auto-publish the Bad Golf website from the repo ROOT (which holds the WEB
# files: golf-app.html and index.html). Every push puts the root contents live
# on GitHub Pages. The www/ folder is the NATIVE app build (Codemagic only) and
# must NOT be the website source — it has no golf-app.html, which 404'd the site.
#
# One-time setup: GitHub repo -> Settings -> Pages -> "Build and deployment" ->
# Source = "GitHub Actions". That's it.

name: Deploy website (root)

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Keep the bare-domain landing page (index.html) byte-identical to the current
      # WEB build (golf-app.html). golf-app.html is the single source of truth for the
      # web app; this copy step means index.html can never drift stale again — you only
      # ever edit golf-app.html (web) and www/index.html (native). Runs on GitHub's real
      # filesystem at deploy time, so it's a clean full copy.
      - name: Sync index.html to the current web build (golf-app.html)
        run: cp golf-app.html index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .          # publish the repo ROOT (golf-app.html + index.html = WEB)
      - id: deployment
        uses: actions/deploy-pages@v4
