# Auto-publish the Bad Golf website from the repo ROOT (which holds the WEB
# files: golf-app.html and index.html). Every push puts the root contents live
# on GitHub Pages. The www/ folder is the NATIVE app build (Codemagic only) and
# must NOT be the website source — it has no golf-app.html, which 404'd the site.
#
# One-time setup: GitHub repo -> Settings -> Pages -> "Build and deployment" ->
# Source = "GitHub Actions". That's it.
#
# WHY TWO JOBS (build + deploy): a single-job workflow re-uploaded the
# "github-pages" artifact every time you clicked "Re-run failed jobs", leaving
# the run with TWO artifacts of the same name -> deploy-pages died with
# "Multiple artifacts named github-pages were unexpectedly found. Artifact
# count is 2." Splitting the upload (build) from the publish (deploy) means a
# "Re-run failed jobs" only re-runs DEPLOY — the already-green build job is
# skipped, so no second artifact is ever created. The collision can't happen.

name: Deploy website (root)

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build the web-only artifact once.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep the bare-domain landing page (index.html) byte-identical to the current
      # WEB build (golf-app.html). golf-app.html is the single source of truth for the
      # web app; this copy step means index.html can never drift stale again — you only
      # ever edit golf-app.html (web) and www/index.html (native). Runs on GitHub's real
      # filesystem at deploy time, so it's a clean full copy.
      - name: Sync index.html to the current web build (golf-app.html)
        run: cp golf-app.html index.html
      # Trim the artifact to WEB-only. The native app build (www/, ios/), the
      # course-import CSVs (data/) and big marketing screenshots are NOT served by
      # the website — shipping the full ~85 MB repo made deploy-pages slow/unreliable
      # (stuck publishes, cancel pile-ups). Removals hit only this ephemeral runner
      # checkout, never the repo. Keeps golf-app.html, index.html, the PDFs,
      # privacy/terms html, and the images the app actually loads.
      - name: Trim non-web files from the Pages artifact
        run: |
          rm -rf ios www data node_modules .git
          rm -f "Screenshot "*.png "Screenshot "*.PNG BadGolf_iPad_*.png || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .          # publish the repo ROOT (golf-app.html + index.html = WEB)

  # Publish the artifact the build job produced. Re-running THIS job alone
  # (the default "Re-run failed jobs") never re-uploads, so it can't duplicate.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
