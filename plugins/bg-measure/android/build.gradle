// Bad Golf — AR distance measure, Android side (v1831).
// Local Capacitor plugin: `npm install` links it from plugins/bg-measure and
// `npx cap sync android` adds it to the generated android/ project (capacitor.settings.gradle
// + capacitor.build.gradle + capacitor.plugins.json), so nothing in codemagic.yaml changes.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.simplisticfishing.badgolf.measure"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    defaultConfig {
        // ARCore needs Android 7.0 (API 24). The app itself is pinned to 24 in codemagic.yaml.
        minSdkVersion 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
        consumerProguardFiles 'proguard-rules.pro'
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    // ActivityResult for the @ActivityCallback (same line every official Capacitor plugin has)
    implementation "androidx.appcompat:appcompat:${project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.6.1'}"
    implementation 'com.google.ar:core:1.44.0'
}
